@if (course(); as c) {
  <div class="plans">
    <div class="plans__glow plans__glow--gold" aria-hidden="true"></div>
    <div class="plans__glow plans__glow--navy" aria-hidden="true"></div>

    <div class="plans__content">
      <header class="plans__header">
        <span class="plans__eyebrow">{{ c.category }}</span>
        <h1>Choisissez votre formule pour</h1>
        <p class="plans__course-title">{{ c.title }}</p>
      </header>

      <div class="plans__grid">
        @for (plan of plans(); track plan.id) {
          <div class="plan-card" [class.plan-card--featured]="plan.featured">
            @if (plan.badge) {
              <span class="plan-card__badge">{{ plan.badge }}</span>
            }
            <h3>{{ plan.name }}</h3>
            <p class="plan-card__price">{{ formatPrice(plan.price) }}</p>

            <ul class="plan-card__features">
              @for (f of plan.features; track f) {
                <li><span>✓</span>{{ f }}</li>
              }
            </ul>

            <button
              type="button"
              class="plan-card__cta"
              (click)="choosePlan(plan.id, plan.price)"
            >
              Choisir cette formule
            </button>
          </div>
        }
      </div>
    </div>
  </div>
}
