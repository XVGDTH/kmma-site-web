<section class="philosophy" aria-labelledby="philosophy-title">
  <div class="philosophy__container">
    <header class="philosophy__header">
      <!-- <h2 id="philosophy-title" class="philosophy__title">
        Des connexions personnelles,
        des solutions concrètes.
      </h2> -->
      <h2 class="philosophy__title">
  <span class="philosophy__title-line1">Des connexions personnelles,</span><br />
  <span class="philosophy__title-line2">des solutions concrètes.</span>
</h2>
      <p class="philosophy__subtitle">
        {{ subtitle }}
      </p>
    </header>
    <div class="philosophy__cards" [class.philosophy__cards--visible]="visible()">
      @for (card of cards; track card.route; let i = $index) {
        <a
          class="philosophy-card"
          [class]="'philosophy-card philosophy-card--' + card.tone"
          [style.--order]="cardOrder[i]"
          [style.--dir]="cardDirection[i]"
          [routerLink]="card.route"
          [attr.aria-label]="'Decouvrir : ' + card.title"
        >
          <span class="philosophy-card__vortex-ring" aria-hidden="true"></span>
          <span class="philosophy-card__title">
            {{ card.title }}
          </span>
          <span class="philosophy-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation" focusable="false">
              <path d="M7 17L17 7M17 7H9M17 7V15" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <svg
            class="philosophy-card__pattern"
            viewBox="0 0 320 190"
            preserveAspectRatio="none"
            role="presentation"
            focusable="false"
          >
